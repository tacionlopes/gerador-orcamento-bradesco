<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orçamento</title>
  <meta name="application-name" content="Orçamento">
  <meta name="apple-mobile-web-app-title" content="Orçamento">
  <meta name="description" content="Gerador de orçamento.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orçamento">
  <meta property="og:description" content="Gerador de orçamento.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Orçamento">
  <meta name="twitter:description" content="Gerador de orçamento.">
  <style>
    :root {
      --paper: #ffffff;
      --canvas: #f2efe9;
      --ink: #131313;
      --muted: #6e6e6e;
      --line: #e6e6e6;
      --accent: #cb2324;
      --accent-dark: #971819;
      --danger: #b91c1c;
      --panel: #f8f5ef;
      --shadow: 0 28px 60px rgba(29, 24, 16, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(242, 239, 233, 0.94)),
        radial-gradient(circle at top left, rgba(203, 35, 36, 0.07), transparent 22%);
      padding: 24px;
    }

    .page-shell {
      max-width: 1320px;
      margin: 0 auto;
    }

    .access-gate {
      min-height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate-card {
      width: min(100%, 420px);
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .gate-card h1 {
      margin: 0 0 10px;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }

    .gate-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .gate-error {
      min-height: 24px;
      margin-top: 12px;
      color: var(--danger);
      font-weight: 700;
    }

    .app-shell[hidden],
    .access-gate[hidden] {
      display: none !important;
    }

    .heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
    }

    .heading h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .heading h1 span {
      color: var(--accent);
    }

    .heading p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
      max-width: 720px;
    }

    .data-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-dark);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .controls {
      position: sticky;
      top: 24px;
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .controls-copy {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .items-editor {
      display: grid;
      gap: 18px;
      margin-bottom: 10px;
    }

    .quote-item {
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .quote-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .item-tools {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: -4px;
    }

    .icon-button,
    .remove-button {
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0;
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button {
      background: #fff;
      color: var(--accent-dark);
      border: 1px solid rgba(151, 24, 25, 0.2);
    }

    .remove-button {
      width: auto;
      min-width: 42px;
      padding: 0 14px;
      background: #efe7da;
      color: var(--ink);
    }

    label {
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select,
    input {
      width: 100%;
      border: 1px solid #d5d2cb;
      border-radius: 14px;
      background: #fff;
      padding: 13px 14px;
      font-size: 0.98rem;
      color: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
    }

    .secondary {
      background: #e9e3d6;
      color: var(--ink);
    }

    .ghost {
      background: #fff;
      color: var(--accent-dark);
      border: 1px solid rgba(151, 24, 25, 0.18);
    }

    .email-button {
      width: 48px;
      height: 48px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .email-button svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    .email-button .email-icon-sent[hidden],
    .email-button .email-icon-default[hidden] {
      display: none;
    }

    .email-button.sent {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: #fff;
      border-color: transparent;
    }

    .error {
      min-height: 24px;
      margin-top: 16px;
      color: var(--danger);
      font-weight: 700;
    }

    .paper-area {
      display: grid;
      gap: 18px;
      justify-items: center;
    }

    .paper-toolbar {
      width: min(100%, 840px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .paper-toolbar p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .paper {
      width: min(100%, 840px);
      min-height: 1188px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 46px 44px 36px;
      position: relative;
      overflow: hidden;
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 16%),
        linear-gradient(90deg, rgba(203, 35, 36, 0.03), transparent 24%);
    }

    .brand-row,
    .meta-grid,
    .footer-row {
      position: relative;
      z-index: 1;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 92px;
    }

    .brand-mark {
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .brand-mark span {
      color: var(--accent);
    }

    .doc-title {
      text-align: left;
      min-width: 240px;
    }

    .doc-title h2 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.02em;
    }

    .doc-title p {
      margin: 10px 0 0;
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .meta-grid {
      display: grid;
      justify-content: end;
      margin-bottom: 78px;
    }

    .meta-table {
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .meta-table td {
      padding: 6px 0 6px 12px;
      vertical-align: top;
    }

    .meta-table td:first-child {
      padding-left: 0;
      min-width: 96px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 84px;
      position: relative;
      z-index: 1;
    }

    .items-table thead th {
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      padding: 10px 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid rgba(255, 255, 255, 0.75);
    }

    .items-table tbody td {
      padding: 10px 12px;
      border: 1px solid var(--line);
      font-size: 0.95rem;
    }

    .items-table .item-cell strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .items-table .item-cell small {
      display: block;
      color: var(--muted);
      line-height: 1.4;
    }

    .items-table .right {
      text-align: right;
      white-space: nowrap;
    }

    .items-table .center {
      text-align: center;
      white-space: nowrap;
    }

    .items-table tfoot td {
      background: var(--accent);
      color: #fff;
      padding: 10px 12px;
      font-size: 0.94rem;
      font-weight: 700;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .payment-note {
      margin: 0 0 110px;
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .footer-row {
      margin-top: auto;
      font-size: 0.8rem;
      color: var(--muted);
      display: grid;
      gap: 14px;
    }

    .signature {
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .signature .mini-brand {
      display: inline-block;
      margin-top: 6px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .signature .mini-brand span {
      color: var(--accent);
    }

    .disclaimer {
      font-size: 0.72rem;
      text-align: center;
      line-height: 1.45;
    }

    .placeholder {
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.98rem;
      margin-top: 120px;
      max-width: 420px;
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .controls {
        position: static;
      }

      .paper {
        min-height: auto;
      }
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .paper {
        padding: 28px 20px 24px;
      }

      .brand-row,
      .paper-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .meta-grid {
        justify-content: start;
      }

      .items-table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <section class="access-gate" id="accessGate">
    <div class="gate-card">
      <h1>Acesso Interno</h1>
      <p>
        Digite a senha para liberar o gerador de orçamento.
      </p>

      <div class="field">
        <label for="accessPassword">Senha</label>
        <input id="accessPassword" type="password" placeholder="Digite a senha">
      </div>

      <div class="actions">
        <button type="button" class="primary" id="accessButton">Entrar</button>
      </div>

      <div class="gate-error" id="accessError" aria-live="polite"></div>
    </div>
  </section>

  <main class="page-shell app-shell" id="appShell" hidden>
    <section class="heading">
      <div>
        <h1>Orçamento <span>Produção Gráfica</span></h1>
      </div>
    </section>

    <div class="layout">
      <aside class="controls">
        <div class="field">
          <label for="nomeJob">Nome do Job</label>
          <input id="nomeJob" type="text" placeholder="Digite o nome do job">
        </div>

        <div class="items-editor" id="itemsEditor"></div>

        <div class="actions">
          <button type="button" class="primary" id="gerar">Gerar Orçamento</button>
          <button type="button" class="ghost" id="pdf" disabled>Gerar PDF</button>
          <button type="button" class="ghost email-button" id="email" aria-label="Enviar por e-mail" title="Enviar por e-mail" disabled>
            <svg class="email-icon-default" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16v12H4z"></path>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <svg class="email-icon-sent" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M3 7h13v10H3z"></path>
              <path d="m3 8 6.5 4.8L16 8"></path>
              <path d="m18 12 2 2 4-4"></path>
            </svg>
          </button>
          <button type="button" class="secondary" id="limpar">Limpar</button>
        </div>

        <div class="error" id="erro" aria-live="polite"></div>
      </aside>

      <section class="paper-area">
        <div class="paper-toolbar">
          <p id="statusPreview">Aguardando seleção.</p>
        </div>

        <article class="paper" id="previewPaper">
          <div class="brand-row">
            <div class="brand-mark">ALMAP<span>BBDO</span></div>
            <div class="doc-title">
              <h2>ORÇAMENTO</h2>
              <p>PRODUÇÃO GRÁFICA</p>
            </div>
          </div>

          <div id="resultado">
            <p class="placeholder">
              Selecione a categoria, escolha o material, informe a quantidade e clique em
              <strong>Gerar Orçamento</strong> para montar a folha.
            </p>
          </div>
        </article>
      </section>
    </div>
  </main>

    function formatCurrency(value) {
      return new Intl.NumberFormat("pt-BR", {
        style: "currency",
        currency: "BRL"
      }).format(value);
    }

    function formatPercent(value) {
      return new Intl.NumberFormat("pt-BR", {
        style: "percent",
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(value);
    }

    function formatDate(date) {

    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function uniqueCategories(list) {
      return [...new Set(list.map((item) => item.Categoria))];
    }

    function fillCategories() {
      return uniqueCategories(rows);
    }

    function hasPricingData(item) {
      return typeof item.Finalizacao === "number" && Number.isFinite(item.Finalizacao) &&
        typeof item.Desconto === "number" && Number.isFinite(item.Desconto);
    }

    function buildClientOptions(selectedClient = "") {
      return [
        '<option value="">Selecione um cliente</option>',
        ...CLIENT_NAMES.map((client) => (
          '<option value="' + escapeHtml(client) + '"' +
          (client === selectedClient ? " selected" : "") +
          ">" + escapeHtml(client) + "</option>"
        ))
      ].join("");
    }

    function buildCategoryOptions(selectedCategory = "") {
      return [
        '<option value="">Selecione uma categoria</option>',
        ...fillCategories().map((category) => (
          '<option value="' + escapeHtml(category) + '"' +
          (category === selectedCategory ? " selected" : "") +
          ">" + escapeHtml(category) + "</option>"
        ))
      ].join("");
    }

    function getMaterialsForCategory(category) {
      return rows.filter((item) => item.Categoria === category && hasPricingData(item));
    }

    function buildMaterialOptions(category, selectedMaterial = "") {
      const materials = getMaterialsForCategory(category);
      if (!category) {
        return '<option value="">Selecione um material</option>';
      }
      if (!materials.length) {
        return '<option value="">Nenhum material com valor disponível</option>';
      }
      return [
        '<option value="">Selecione um material</option>',
        ...materials.map((item) => (
          '<option value="' + escapeHtml(item.Material) + '"' +
          (item.Material === selectedMaterial ? " selected" : "") +
          ">" + escapeHtml(item.Material) + "</option>"
        ))
      ].join("");
    }

    function createItemBlock(index, data = {}) {
      const block = document.createElement("section");
      const client = data.client || "";
      const category = data.category || "";
      const material = data.material || "";
      const quantity = data.quantity || "";

      block.className = "quote-item";
      block.dataset.itemIndex = String(index);
      block.innerHTML = [
        '<div class="field">',
        '  <label>Cliente</label>',
        '  <select class="cliente-select">',
             buildClientOptions(client),
        '  </select>',
        '</div>',
        '<div class="field">',
        '  <label>Categoria</label>',
        '  <select class="categoria-select">',
             buildCategoryOptions(category),
        '  </select>',
        '</div>',
        '<div class="field">',
        '  <label>Material</label>',
        '  <select class="material-select"' + (category ? "" : " disabled") + '>',
             buildMaterialOptions(category, material),
        '  </select>',
        '</div>',
        '<div class="field">',
        '  <label>Quantidade</label>',
        '  <input class="quantidade-input" type="number" min="1" step="1" placeholder="Digite a quantidade" value="' + escapeHtml(quantity) + '">',
        '</div>',
        '<div class="item-tools">',
        '  <button type="button" class="icon-button add-item-button" aria-label="Adicionar item">+</button>',
            index > 0 ? '  <button type="button" class="remove-button remove-item-button">Remover</button>' : "",
        '</div>'
      ].join("");

      return block;
    }

    function refreshItemControls() {
      const blocks = [...itemsEditor.querySelectorAll(".quote-item")];
      blocks.forEach((block, index) => {
        block.dataset.itemIndex = String(index);
        const removeButton = block.querySelector(".remove-item-button");
        if (removeButton) {
          removeButton.hidden = blocks.length === 1;
        }
      });
    }

    function addItemBlock(data = {}) {
      itemsEditor.appendChild(createItemBlock(itemsEditor.children.length, data));
      refreshItemControls();
    }

      itemsEditor.innerHTML = "";
      addItemBlock();
    }

    function syncMaterialOptions(block) {
      const categorySelect = block.querySelector(".categoria-select");
      const materialSelect = block.querySelector(".material-select");
      const previousValue = materialSelect.value;
      materialSelect.innerHTML = buildMaterialOptions(categorySelect.value, previousValue);
      materialSelect.disabled = !categorySelect.value || !getMaterialsForCategory(categorySelect.value).length;
      if (![...materialSelect.options].some((option) => option.value === previousValue)) {
        materialSelect.value = "";
      }
    }

    function getBudgetItems() {
      const blocks = [...itemsEditor.querySelectorAll(".quote-item")];
      const items = [];

      for (const [index, block] of blocks.entries()) {
        const client = block.querySelector(".cliente-select").value;
        const category = block.querySelector(".categoria-select").value;
        const material = block.querySelector(".material-select").value;
        const quantity = Number(block.querySelector(".quantidade-input").value);

        if (!client) {
          throw new Error("Cliente não selecionado no item " + (index + 1) + ".");
        }

        if (!category) {
          throw new Error("Categoria não selecionada no item " + (index + 1) + ".");
        }

        if (!material) {
          throw new Error("Material não selecionado no item " + (index + 1) + ".");
        }

        if (!Number.isInteger(quantity) || quantity <= 0) {
          throw new Error("Quantidade inválida no item " + (index + 1) + ".");
        }

        const item = getMaterialsForCategory(category).find((row) => row.Material === material);
        if (!item) {
          throw new Error("Material não selecionado no item " + (index + 1) + ".");
        }

        if (item.Finalizacao === null || item.Finalizacao === "") {
          throw new Error("Item sem valor na coluna Finalizacao no item " + (index + 1) + ".");
        }

        if (item.Desconto === null || item.Desconto === "") {
          throw new Error("Item sem valor na coluna Desconto no item " + (index + 1) + ".");
        }

        const valorUnitarioComDesconto = item.Finalizacao * (1 - item.Desconto);
        items.push({
          cliente: client,
          categoria: item.Categoria,
          clienteCategoria: client + " - " + item.Categoria,
          material: item.Material,
          quantidade: quantity,
          valorBase: item.Finalizacao,
          desconto: item.Desconto,
          valorUnitarioComDesconto,
          total: valorUnitarioComDesconto * quantity
        });
      }

      return items;
    }

    function renderBudget(items) {
      const nomeJob = nomeJobInput.value.trim() || items[0].material;
      const cliente = [...new Set(items.map((item) => item.cliente))].join(", ");
      const dateText = formatDate(new Date());
      const total = items.reduce((sum, item) => sum + item.total, 0);

      currentBudget = {
        dateText,
        cliente,
        nomeJob,
        items,
        total
      };

      pdfButton.disabled = false;
      emailButton.disabled = false;
      resetEmailSentState();
      setPreviewStatus("Orçamento pronto para exportação.");

      resultado.innerHTML = [
        '<div class="meta-grid">',
        '  <table class="meta-table">',
        '    <tr><td>Data:</td><td>' + escapeHtml(dateText) + '</td></tr>',
        '    <tr><td>Cliente:</td><td>' + escapeHtml(cliente) + '</td></tr>',
        '    <tr><td>Job:</td><td>' + escapeHtml(nomeJob) + '</td></tr>',
        '  </table>',
        '</div>',
        '<table class="items-table">',
        '  <thead>',
        '    <tr>',
        '      <th>Itens</th>',
        '      <th>Qtde</th>',
        '      <th>Valor</th>',
        '    </tr>',
        '  </thead>',
        '  <tbody>',
             items.map((item) => [
               '    <tr>',
               '      <td class="item-cell"><strong>' + escapeHtml(item.material) + '</strong><small>' + escapeHtml(item.clienteCategoria) + '</small></td>',
               '      <td class="center">' + escapeHtml(String(item.quantidade)) + '</td>',
               '      <td class="right">' + escapeHtml(formatCurrency(item.total)) + '</td>',
               '    </tr>'
             ].join("")).join(""),
        '  </tbody>',
        '  <tfoot>',
        '    <tr>',
        '      <td colspan="2">Total</td>',
        '      <td class="right">' + escapeHtml(formatCurrency(total)) + '</td>',
        '    </tr>',
        '  </tfoot>',
        '</table>',
        '<p class="payment-note">Cond. Pgto.: 60 dias</p>',
        '<div class="footer-row">',
        '  <div class="signature">Rose Ribeiro<br><span class="mini-brand">ALMAP<span>BBDO</span></span><br>Produção Gráfica</div>',
        '  <div class="disclaimer">ALMAP BBDO, AVENIDA ROQUE PETRONI JÚNIOR, 999, 5º, 6º, 7º ANDAR, SÃO PAULO, SP. TELEFONE +55 11 2195 4400. WWW.ALMAPBBDO.COM.BR<br>Confidential - Not for Public Consumption or Distribution</div>',
        '</div>'
      ].join("");
    }

    function sanitizePdfText(text) {
      return String(text)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[“”]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/–|—/g, "-")
        .replace(/\u2026/g, "...")
        .replace(/€/g, "EUR")
        .replace(/[^\x20-\xFF]/g, " ");
    }

    function escapePdfText(text) {
      return sanitizePdfText(text)
        .replace(/\\/g, "\\\\")
        .replace(/\(/g, "\\(")
        .replace(/\)/g, "\\)");
    }

    function buildPdfDocument(budget) {
      const width = 595;
      const height = 842;
      const lines = [];
      const red = "0.796 0.137 0.141";
      const black = "0 0 0";
      const white = "1 1 1";
      const lightGray = "0.88 0.88 0.88";

      function text(x, y, size, value, font, color) {
        lines.push(color + " rg");
        lines.push("BT");
        lines.push("/" + font + " " + size + " Tf");
        lines.push("1 0 0 1 " + x + " " + y + " Tm");
        lines.push("(" + escapePdfText(value) + ") Tj");
        lines.push("ET");
      }

      function line(x1, y1, x2, y2, color) {
        lines.push(color + " RG");
        lines.push("0.8 w");
        lines.push(x1 + " " + y1 + " m");
        lines.push(x2 + " " + y2 + " l");
        lines.push("S");
      }

      function fillRect(x, y, w, h, color) {
        lines.push(color + " rg");
        lines.push(x + " " + y + " " + w + " " + h + " re f");
      }

      function rightText(rightX, y, size, value, font, color) {
        const approxWidth = sanitizePdfText(value).length * size * 0.5;
        text(rightX - approxWidth, y, size, value, font, color);
      }

      const bodyStartY = 478;
      const rowHeight = 34;
      const totalRectY = 462 - (budget.items.length * rowHeight);
      const totalTopY = totalRectY + 22;
      const paymentY = Math.max(totalRectY - 92, 185);

      fillRect(40, 500, 515, 28, red);
      fillRect(40, totalRectY, 515, 22, red);
      line(40, totalTopY, 555, totalTopY, lightGray);
      line(375, 528, 375, totalRectY, lightGray);
      line(443, 528, 443, totalRectY, lightGray);

      text(44, 785, 22, "ALMAP", "F2", black);
      text(120, 785, 22, "BBDO", "F2", red);
      text(375, 786, 20, "ORCAMENTO", "F2", black);
      text(375, 768, 9, "PRODUCAO GRAFICA", "F2", black);

      text(375, 675, 9, "DATA:", "F2", black);
      text(432, 675, 9, budget.dateText, "F1", black);
      text(375, 653, 9, "CLIENTE:", "F2", black);
      text(432, 653, 9, budget.cliente, "F1", black);
      text(375, 631, 9, "JOB:", "F2", black);
      text(432, 631, 9, budget.nomeJob, "F1", black);

      text(205, 510, 9, "ITENS", "F2", white);
      text(392, 510, 9, "QTDE", "F2", white);
      text(482, 510, 9, "VALOR", "F2", white);

      budget.items.forEach((item, index) => {
        const itemY = bodyStartY - (index * rowHeight);
        text(48, itemY, 10, item.material, "F2", black);
        text(48, itemY - 16, 8, item.clienteCategoria, "F1", black);
        text(407, itemY - 8, 10, String(item.quantidade), "F1", black);
        rightText(522, itemY - 8, 10, formatCurrency(item.total), "F1", black);
      });

      text(48, totalRectY + 7, 9, "TOTAL", "F2", white);
      rightText(522, totalRectY + 7, 10, formatCurrency(budget.total), "F2", white);

      text(40, paymentY, 9, "COND. PGTO.: 60 DIAS", "F2", black);

      text(40, 140, 8, "ROSE RIBEIRO", "F2", black);
      text(40, 124, 10, "ALMAP", "F2", black);
      text(84, 124, 10, "BBDO", "F2", red);
      text(40, 110, 7, "PRODUCAO GRAFICA", "F2", black);

      text(74, 58, 6, "ALMAP BBDO, AVENIDA ROQUE PETRONI JUNIOR, 999, 5, 6, 7 ANDAR, SAO PAULO, SP. TELEFONE +55 11 2195 4400. WWW.ALMAPBBDO.COM.BR", "F1", black);
      text(170, 48, 6, "Confidential - Not for Public Consumption or Distribution", "F1", black);

      const stream = lines.join("\n");
      const objects = [];
      objects.push("1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj");
      objects.push("2 0 obj << /Type /Pages /Count 1 /Kids [3 0 R] >> endobj");
      objects.push("3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 " + width + " " + height + "] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >> endobj");
      objects.push("4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj");
      objects.push("5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >> endobj");
      objects.push("6 0 obj << /Length " + stream.length + " >> stream\n" + stream + "\nendstream endobj");

      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      for (const object of objects) {
        offsets.push(pdf.length);
        pdf += object + "\n";
      }
      const xrefStart = pdf.length;
      pdf += "xref\n0 " + (objects.length + 1) + "\n";
      pdf += "0000000000 65535 f \n";
      for (let index = 1; index < offsets.length; index += 1) {
        pdf += String(offsets[index]).padStart(10, "0") + " 00000 n \n";
      }
      pdf += "trailer << /Size " + (objects.length + 1) + " /Root 1 0 R >>\n";
      pdf += "startxref\n" + xrefStart + "\n%%EOF";

      return new Uint8Array(Array.from(pdf, (char) => char.charCodeAt(0) & 255));
    }

    function getPdfExportData() {
      const bytes = buildPdfDocument(currentBudget);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const safeMaterial = currentBudget.nomeJob
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 40) || "orcamento";
      const filename = "orcamento-bradesco-" + safeMaterial + ".pdf";

      return { bytes, blob, filename };
    }

    function downloadPdf() {
      if (!currentBudget) {
        showError("Gere um orçamento antes de exportar o PDF.");
        return;
      }

      const { blob, filename } = getPdfExportData();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function sendByEmail() {
      if (!currentBudget) {
        showError("Gere um orçamento antes de enviar por e-mail.");
        return;
      }

      const { blob, filename } = getPdfExportData();

      if (typeof File !== "undefined" && navigator.share && navigator.canShare) {
        const pdfFile = new File([blob], filename, { type: "application/pdf" });
        if (navigator.canShare({ files: [pdfFile] })) {
          try {
            await navigator.share({
              files: [pdfFile],
              title: "Orçamento",
              text: "Enviar orçamento para " + DELIVERY_EMAIL
            });
            markEmailSentState();
            setPreviewStatus("PDF compartilhado com sucesso.");
            return;
          } catch (error) {
            if (error && error.name === "AbortError") {
              return;
            }
          }
        }
      }

      downloadPdf();
      const subject = encodeURIComponent("Orçamento Produção Gráfica - " + currentBudget.nomeJob);
      const body = encodeURIComponent(
        "Segue o PDF do orçamento.\n\n" +
        "Destinatário: " + DELIVERY_EMAIL + "\n" +
        "O arquivo foi baixado automaticamente para anexo."
      );
      window.location.href = "mailto:" + DELIVERY_EMAIL + "?subject=" + subject + "&body=" + body;
      setPreviewStatus("Rascunho de e-mail aberto. Anexe o PDF baixado para enviar.");
    }

    function unlockApp() {
      sessionStorage.setItem(ACCESS_STORAGE_KEY, "ok");
      accessGate.hidden = true;
      appShell.hidden = false;
      clearAccessError();
      accessPasswordInput.value = "";
    }

    function handleAccess() {
      clearAccessError();

      if (accessPasswordInput.value !== ACCESS_PASSWORD) {
        showAccessError("Senha incorreta.");
        return;
      }

      unlockApp();
    }

    itemsEditor.addEventListener("change", (event) => {
      const categorySelect = event.target.closest(".categoria-select");
      if (!categorySelect) {
        return;
      }

      clearError();
      showEmptyResult();
      syncMaterialOptions(categorySelect.closest(".quote-item"));
    });

    itemsEditor.addEventListener("input", () => {
      clearError();
      showEmptyResult();
    });

    itemsEditor.addEventListener("click", (event) => {
      const addButton = event.target.closest(".add-item-button");
      if (addButton) {
        clearError();
        addItemBlock();
        return;
      }

      const removeButton = event.target.closest(".remove-item-button");
      if (removeButton) {
        removeButton.closest(".quote-item").remove();
        refreshItemControls();
        clearError();
        showEmptyResult();
      }
    });

    gerarButton.addEventListener("click", () => {
      clearError();
      try {
        renderBudget(getBudgetItems());
      } catch (error) {
        showError(error.message);
        showEmptyResult();
      }
    });

    limparButton.addEventListener("click", () => {
      nomeJobInput.value = "";
      resetItemBlocks();
      clearError();
      showEmptyResult();
    });

    pdfButton.addEventListener("click", downloadPdf);
    emailButton.addEventListener("click", () => {
      sendByEmail();
    });
    accessButton.addEventListener("click", handleAccess);
    accessPasswordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleAccess();
      }
    });

    resetItemBlocks();
    showEmptyResult();

    if (sessionStorage.getItem(ACCESS_STORAGE_KEY) === "ok") {
      unlockApp();
    }
  </script>
</body>
</html>
